name: poker_module
description: Módulo de Texas Hold'em Poker (Flutter + GetX) com arquitetura modular feature-first — engine, avaliação de mãos, mesa jogável com sons/fichas animadas e modos online/bots.
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  # Áudio dos efeitos do jogo (fichas, cartas, turnos, vitória).
  audioplayers: ^6.1.0
  # WebSocket real para o modo online (usa a implementação web no navegador).
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
